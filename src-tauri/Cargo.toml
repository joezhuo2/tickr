[package]
name = "tickr"
version = "0.7.1"
edition = "2021"
license = "MIT"
description = "Stock watcher for the Windows tray and the macOS menu bar"
authors = ["Joe Zhuo"]
repository = "https://github.com/joezhuo2/tickr"

[lib]
name = "tickr_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
dirs = "6"
log = "0.4"
tauri-plugin-updater = "2.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }
