name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Fail in seconds, not after a full build, when the updater key secret is
      # missing or mangled. tauri only reports "Missing comment in secret key".
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. Run: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/tickr.key"
            exit 1
          fi
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 --decode 2>/dev/null | head -n 1 | grep -q '^untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the contents of ~/.tauri/tickr.key (expected one base64 line)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles and latest.json. Required: without the
          # key, createUpdaterArtifacts makes the build fail.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signing (optional). Add these as repository secrets and uncomment.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: tickr v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            See [CHANGELOG.md](https://github.com/joezhuo2/tickr/blob/main/CHANGELOG.md) for what changed.

            **Windows:** download the `-setup.exe` installer. It is not code-signed, so SmartScreen may show "Windows protected your PC": click **More info** > **Run anyway**.
            **macOS:** download the `.dmg` (universal, Apple silicon and Intel). It is not notarized, so macOS blocks the first launch. On macOS 15 or later, open tickr, close the warning, then go to **System Settings > Privacy & Security** and click **Open Anyway**. On macOS 14 or earlier, right-click tickr in Applications and choose **Open**.

            Already on v0.5.1 or later? tickr updates itself: right-click the tray icon and pick **Install vX.Y.Z and restart**.

            Data comes from Yahoo Finance's unofficial endpoints and may be delayed. Not investment advice.
          args: ${{ matrix.args }}
          # GitHub sometimes drops an asset upload ("other side closed"). A
          # retry re-uploads instead of failing the job and leaving latest.json
          # without this platform.
          retryAttempts: 2

  # Both build jobs merge their platform into the release's latest.json; if
  # they race, one entry can be lost and that platform stops auto-updating.
  check-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature' latest.json > /dev/null || { echo "latest.json is missing $p"; exit 1; }
          done
          jq . latest.json
