name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (optional). Add these as repository secrets and uncomment.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: tickr v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            See [CHANGELOG.md](https://github.com/joezhuo2/tickr/blob/main/CHANGELOG.md) for what changed.

            **Windows:** download the `-setup.exe` installer. It is unsigned, so SmartScreen may show "Windows protected your PC"; click **More info** > **Run anyway**.
            **macOS:** download the `.dmg` (universal, Apple silicon and Intel). If the build is unsigned, right-click the app > **Open** the first time, or run `xattr -dr com.apple.quarantine /Applications/tickr.app`.

            Data comes from Yahoo Finance's unofficial endpoints and may be delayed. Not investment advice.
          args: ${{ matrix.args }}
